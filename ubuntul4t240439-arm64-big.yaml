---
extend: ubuntu2404-arm64-nfs.yaml

global:
  g5k_distrib: $${distrib}l4t
  # Must force 2404, because release_number is "24.04".
  g5k_release_number: 2404$${l4t_version_major}
  g5k_description: $${distrib} $${release_number} ($${release}) with L4T $${l4t_version} for $${arch} - $${g5k_variant}
  # Grid'5000 environment variant
  g5k_variant: big
  # Make kadeploy not use update-grub to generate grub.cfg
  g5k_no_chroot_for_grub: true
  g5k_postinst_script: g5k-postinstall --net netplan --fstab nfs --restrict-user current --disk-aliases && chroot ${KADEPLOY_ENV_EXTRACTION_DIR} /usr/local/bin/g5k-fix-extlinux
  appliance_formats: tar.zst
  appliance_tar_excludes: >-
    ./etc/fstab ./root/.bash_history ./root/kameleon_workdir ./root/.ssh
    ./var/tmp/* ./tmp/* ./dev/* ./proc/* ./run/*
    ./sys/* ./root/.rpmdb ./boot/grub ./boot/grub2
  image_size: 100G

  # L4T information
  l4t_version_major: "39"
  l4t_version_minor: "2"
  l4t_version_patch: "1"
  l4t_version: r$${l4t_version_major}.$${l4t_version_minor}.$${l4t_version_patch}
  nvidia_BSP_url: "https://developer.nvidia.com/downloads/embedded/L4T/r$${l4t_version_major}_Release_v$${l4t_version_minor}.$${l4t_version_patch}/release/Jetson_Linux_R$${l4t_version_major}.$${l4t_version_minor}.$${l4t_version_patch}_aarch64.tbz2"
  workdir: "/nvidia"
  l4t_dir: "$${workdir}/Linux_for_Tegra"
  rootfs: "/"
  extra_deb_packages: "nvidia-jetpack linux-nvidia-tegra"
  extra_pip3_packages: "jetson-stats"
  l4t_nvp_model: 3

bootstrap:
  - "@base"

setup:
  - "@base"
  - add_extlinux_fix_script:
    - write_script:
      - exec_in: |
          cat << 'EOF' > /usr/local/bin/g5k-fix-extlinux
          #!/bin/bash
          # Get UUID from /etc/fstab (created by g5k-postinstall)
          UUID=$(awk '$2 == "/" {print $1}' /etc/fstab)
          if [[ "$UUID" == UUID=* ]]; then
            EXTLINUX_CONF="/boot/extlinux/extlinux.conf"
            if [ -f "$EXTLINUX_CONF" ]; then
              sed -i 's|/boot/Image|/boot/vmlinuz|g' "$EXTLINUX_CONF"
              sed -i 's|/boot/initrd|/boot/initrd.img|g' "$EXTLINUX_CONF"
              sed -i "s|APPEND \${cbootargs}|APPEND \${cbootargs} root=$UUID|g" "$EXTLINUX_CONF"
              echo "Updated extlinux.conf with root=$UUID"
            else
              echo "Error: $EXTLINUX_CONF not found"
            fi
          else
            echo "Error: Could not find root UUID in /etc/fstab"
          fi
          EOF
          chmod +x /usr/local/bin/g5k-fix-extlinux
  - fix_boot_partition:
    - move_boot:
      - exec_in: |
          # Move /boot to root filesystem so it gets exported by tar --one-file-system
          if mountpoint -q /boot; then
            if mountpoint -q /boot/efi; then
              EFI_DEV=$(findmnt -n -o SOURCE /boot/efi)
              umount /boot/efi
              sed -i '/\/boot\/efi/d' /etc/fstab
              if [ -n "$EFI_DEV" ]; then wipefs -a "$EFI_DEV"; fi
            fi
            BOOT_DEV=$(findmnt -n -o SOURCE /boot)
            cp -a /boot /boot_tmp
            umount /boot
            rm -rf /boot/*
            cp -a /boot_tmp/* /boot/
            rm -rf /boot_tmp
            sed -i '/\/boot /d' /etc/fstab
            if [ -n "$BOOT_DEV" ]; then wipefs -a "$BOOT_DEV"; fi
          fi
  - prepare_L4T:
    - install_L4T_required_packages:
      - apt-get_in: update
      - apt-get_in: -q=2 remove --purge linux-image-* linux-modules-* linux-headers-*
      - apt-get_in: install libegl1 libcairo2 libgles2 libgtk-3-0t64 libwayland-egl1 libxkbcommon0 libasound2t64 libgstreamer1.0-0 libgstreamer-plugins-bad1.0-0 libgstreamer-plugins-base1.0-0 device-tree-compiler libdatrie1 libfontconfig1 libharfbuzz0b libpangoft2-1.0-0 libpixman-1-0 libxrender1 libpango-1.0-0 libpangocairo-1.0-0 libnl-route-3-200 libevdev2 libinput10 libjpeg-turbo8 libunwind8 libwayland-cursor0 qemu-user-static bridge-utils python3-tk python3-matplotlib gir1.2-appindicator3-0.1 libc6-arm64-cross nvme-cli libpcre3 i2c-tools libwayland-server0 libseat1

    - install_nvidia_BSP:
      - on_setup_clean:
        - exec_in: rm -rf $${workdir}
      - exec_in: |
          set -e
          mkdir -p $${l4t_dir}
          wget --progress=dot:giga -O- $${nvidia_BSP_url} | tar -jx --strip-components=1 -C $${l4t_dir}
    - mount_rootfs_in_BSP:
      - on_setup_clean:
        - exec_in: umount $${l4t_dir}/rootfs
      - exec_in: mount --bind $${rootfs} $${l4t_dir}/rootfs
  - apply_L4T_overlay:
    - fix_nv_apply_debs_for_using_slash_as_rootfs:
      - exec_in: |
          echo -e "function qemu_setup_rootfs() { return 0; }\nfunction qemu_cleanup_rootfs() { return 0; }" > $${l4t_dir}/nv_tegra/nv_qemu_setup_helper.sh
    - configure_dpkg_noninteractive:
      - exec_in: |
          mkdir -p /etc/dpkg/dpkg.cfg.d
          echo -e "force-confdef\nforce-confold" > /etc/dpkg/dpkg.cfg.d/force-confold
    - apply_L4T:
      - exec_in: $${l4t_dir}/apply_binaries.sh -r $${rootfs}
    - disable_unwanted_L4T_services:
      - exec_in: |
          set -e
          systemctl disable nv-l4t-bootloader-config.service
          systemctl disable nv-l4t-usb-device-mode.service
    - configure_nvpmodel:
      - exec_in: |
          set -e
          mkdir -p /var/lib/nvpmodel
          printf "/etc/nvpmodel.conf" > /var/lib/nvpmodel/conf_file_path
          printf "pmode:%04d" $${l4t_nvp_model} > /var/lib/nvpmodel/status
  - install_extra_packages:
    - download_extra_packages:
      - apt-get_in: clean
      - apt-get_in: update
      - apt-get_in: install --download-only $${extra_deb_packages}
    - install_extra_deb_packages:
      - exec_in: |
          set -e
          # Prevent xx-nvidia-update-kernel-partitions from failing in chroot
          mkdir -p /etc/kernel/postinst.d
          if [ ! -f /etc/kernel/postinst.d/xx-nvidia-update-kernel-partitions.real ]; then
            dpkg-divert --add --rename --divert /etc/kernel/postinst.d/xx-nvidia-update-kernel-partitions.real /etc/kernel/postinst.d/xx-nvidia-update-kernel-partitions
            echo -e "#!/bin/sh\nexit 0" > /etc/kernel/postinst.d/xx-nvidia-update-kernel-partitions
            chmod +x /etc/kernel/postinst.d/xx-nvidia-update-kernel-partitions
          fi
          # Workaround installation for nsight-system that requires running on target
          deb=$(ls /var/cache/apt/archives | grep -o -e 'nsight-systems-[^_]\+' | sort -u || true)
          if [ -n "$deb" ]; then
            echo "Workaround installation of $deb..."
            for package in $deb; do
              dpkg --unpack /var/cache/apt/archives/$package*.deb || true
              sed -i.orig \
                  -e '4,7s/^/#/' \
                  -e '9,15s/^/#/' \
                   /var/lib/dpkg/info/$package.*postinst || true
            done
            DEBIAN_FRONTEND=noninteractive apt-get -f -y install
            for package in $deb; do
              mv /var/lib/dpkg/info/$package.*postinst.orig /var/lib/dpkg/info/$package.*postinst || true
            done
          fi
      - apt-get_in: install $${extra_deb_packages}
      - apt-get_in: clean
    - install_extra_pip3_packages:
      - apt-get_in: install python3-pip
      - exec_in: |
          set -e
          if [ -n "$${extra_pip3_packages}" ]; then
            pip3 install --break-system-packages $${extra_pip3_packages}
          fi
    - clean_apt_cache:
      - on_setup_clean:
        - apt-get_in: clean
export:
  - "@base"
