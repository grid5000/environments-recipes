---
extend: ubuntu2404-arm64-nfs.yaml

global:
  g5k_distrib: $${distrib}l4t
  g5k_release_number: 2404$${l4t_version_major}
  g5k_description: $${distrib} $${release_number} ($${release}) with L4T $${l4t_version} for $${arch} - $${g5k_variant}
  g5k_no_chroot_for_grub: "true"
  # Grid'5000 environment variant
  g5k_variant: big
  # Generate only the appliance for bare-metal deployment, not for VMs.
  appliance_formats: tar.zst
  image_size: 100G

  # L4T information
  l4t_version_major: "39"
  l4t_version_minor: "2"
  l4t_version_patch: "1"
  l4t_version: r$${l4t_version_major}.$${l4t_version_minor}.$${l4t_version_patch}
  nvidia_BSP_url: "https://developer.download.nvidia.com/embedded/L4T/r$${l4t_version_major}_Release_v$${l4t_version_minor}.$${l4t_version_patch}/release/Jetson_Linux_R$${l4t_version_major}.$${l4t_version_minor}.$${l4t_version_patch}_aarch64.tbz2"
  workdir: "/nvidia"
  l4t_dir: "$${workdir}/Linux_for_Tegra"
  rootfs: "/"
  extra_deb_packages: "nvidia-jetpack linux-nvidia-tegra"
  extra_pip3_packages: "jetson-stats"
  l4t_nvp_model: 3

bootstrap:
  - "@base"

setup:
  - "@base"
  - prepare_L4T:
    - install_L4T_required_packages:
      - apt-get_in: update
      - apt-get_in: -q=2 remove --purge linux-image-* linux-modules-* linux-headers-*
      - apt-get_in: install libegl1 libcairo2 libgles2 libgtk-3-0t64 libwayland-egl1 libxkbcommon0 libasound2t64 libgstreamer1.0-0 libgstreamer-plugins-bad1.0-0 libgstreamer-plugins-base1.0-0 device-tree-compiler libdatrie1 libfontconfig1 libharfbuzz0b libpangoft2-1.0-0 libpixman-1-0 libxrender1 libpango-1.0-0 libpangocairo-1.0-0 libnl-route-3-200 libevdev2 libinput10 libjpeg-turbo8 libunwind8 libwayland-cursor0 qemu-user-static bridge-utils python3-tk python3-matplotlib gir1.2-appindicator3-0.1 libc6-arm64-cross nvme-cli libpcre3 i2c-tools libwayland-server0 libseat1
    - install_nvidia_BSP:
      - on_setup_clean:
        - exec_in: rm -rf $${workdir}
      - exec_in: |
          set -e
          mkdir -p $${l4t_dir}
          wget --progress=dot:giga -O- $${nvidia_BSP_url} | tar -jx --strip-components=1 -C $${l4t_dir}
    - mount_rootfs_in_BSP:
      - on_setup_clean:
        - exec_in: umount $${l4t_dir}/rootfs
      - exec_in: mount --bind $${rootfs} $${l4t_dir}/rootfs
  - apply_L4T_overlay:
    - fix_nv_apply_debs_for_using_slash_as_rootfs:
      - exec_in: echo -e "function qemu_setup_rootfs() { return 0; }\nfunction qemu_cleanup_rootfs() { return 0; }" > $${l4t_dir}/nv_tegra/nv_qemu_setup_helper.sh
    - apply_L4T:
      - exec_in: DPKG_FORCE="confold,confdef" DEBIAN_FRONTEND=noninteractive $${l4t_dir}/apply_binaries.sh -r $${rootfs}
    - disable_unwanted_L4T_services:
      - exec_in: |
          set -e
          systemctl disable nv-l4t-bootloader-config.service
          systemctl disable nv-l4t-usb-device-mode.service
    - configure_nvpmodel:
      - exec_in: |
          set -e
          mkdir -p /var/lib/nvpmodel
          printf "/etc/nvpmodel.conf" > /var/lib/nvpmodel/conf_file_path
          printf "pmode:%04d" $${l4t_nvp_model} > /var/lib/nvpmodel/status
  - install_extra_packages:
    - download_extra_packages:
      - apt-get_in: clean
      - apt-get_in: update
      - apt-get_in: install --download-only $${extra_deb_packages}
    - install_extra_deb_packages:
      - exec_in: |
          set -e
          # Workaround nsight-systems postinst & skip kernel partition flash
          for f in /var/cache/apt/archives/*nsight-systems*.deb; do
            [ -e "$f" ] || continue; p=$(dpkg-deb -f "$f" Package)
            DEBIAN_FRONTEND=noninteractive apt-get -y --allow-unauthenticated install $(apt-cache depends $p | awk '/Depends:/{print $2}' | tr -d '<>')
            dpkg --unpack "$f"
            sed -i.orig -e '4,7s/^/#/' -e '9,15s/^/#/' /var/lib/dpkg/info/$p.*postinst 2>/dev/null || true
            dpkg --configure --pending || true
            mv /var/lib/dpkg/info/$p.*postinst.orig /var/lib/dpkg/info/$p.*postinst 2>/dev/null || true
          done
          mkdir -p /etc/kernel/postinst.d
          dpkg-divert --add --rename --divert /etc/kernel/postinst.d/xx-nvidia-update-kernel-partitions.real /etc/kernel/postinst.d/xx-nvidia-update-kernel-partitions || true
          ln -sf /bin/true /etc/kernel/postinst.d/xx-nvidia-update-kernel-partitions
      - apt-get_in: install $${extra_deb_packages}
      - apt-get_in: clean
    - install_extra_pip3_packages:
      - apt-get_in: install python3-pip
      - exec_in: |
          set -e
          if [ -n "$${extra_pip3_packages}" ]; then
            pip3 install --break-system-packages $${extra_pip3_packages}
          fi
    - clean_apt_cache:
      - on_setup_clean:
        - apt-get_in: clean
    - setup_kadeploy_kernel_links:
      - exec_in: |
          cd /boot
          # Kadeploy requirement
          if [ -f Image ]; then
            ln -sf Image vmlinuz
          else
            KERNEL=$(ls vmlinuz-* | grep -v "\.old" | head -n 1)
            if [ -n "$KERNEL" ]; then ln -sf $KERNEL vmlinuz; fi
          fi
          
          if [ -f initrd ]; then
            ln -sf initrd initrd.img
          else
            INITRD=$(ls initrd.img-* | grep -v "\.old" | head -n 1)
            if [ -n "$INITRD" ]; then ln -sf $INITRD initrd.img; fi
          fi
          
          # Workaround for guestmount LVM bug: sync /boot to the underlying rootfs
          mkdir -p /mnt/rootfs
          mount --bind / /mnt/rootfs
          cp -a /boot/* /mnt/rootfs/boot/
          umount /mnt/rootfs
export:
  - "@base"
